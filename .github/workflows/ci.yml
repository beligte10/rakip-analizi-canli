name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # data/ git'e girmediği için computed.json/parquet'e bağlı testler CI'da
      # ATLANIR (yeşil ≠ tam doğrulama). Altın veri fixture'ı eklenmeli.
      - run: python -m pytest tests/ -q -rs

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Bilgilendirici: bağımlılık CVE bulgusu PR'ı kırmaz, ama raporlanır.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
